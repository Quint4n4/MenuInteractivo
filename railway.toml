[deploy]
# Arranque conocido-bueno: migrate + collectstatic + daphne en el MISMO
# contenedor de runtime (collectstatic en preDeploy NO sirve: ese comando
# corre en un contenedor efimero separado del que sirve la app).
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p $PORT clinic_service.asgi:application"

# Healthcheck: si el proceso se cuelga, Railway lo detecta y lo reinicia solo
# (convierte el "redeploy manual" en recuperacion automatica). Requiere que
# 'healthcheck.railway.app' este en ALLOWED_HOSTS (ver settings.py).
healthcheckPath = "/api/health"
healthcheckTimeout = 100

# Reinicio automatico ante fallos.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
